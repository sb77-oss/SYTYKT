<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>SO YOU THINK YOU KNOW THINGS · The Archive</title>
<meta name="description" content="Play Seasons I to III of So You Think You Know Things on your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0f;--surface:#13131a;--surface2:#1a1a24;--border:#252535;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --text:#f0f0f5;--muted:#8a8ab0;--dim:#55556e;
  --r:16px;--font-d:'Syne',system-ui,sans-serif;--font-b:'DM Sans',system-ui,sans-serif;
  --c:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:17px;line-height:1.45}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 110px}
.screen{display:none}.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(11,11,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px}
.bar .t{flex:1;font-family:var(--font-d);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .score{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--amber)}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:18px}

/* home */
.hero{text-align:center;padding:34px 0 22px}
.hero .k{font-family:var(--font-d);font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.hero h1{font-family:var(--font-d);font-weight:800;font-size:clamp(34px,10vw,52px);line-height:.95;margin:14px 0 12px;letter-spacing:-.01em}
.hero h1 span{display:block;background:linear-gradient(90deg,#ff6eb4,#a855f7,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:15px}
.big{display:block;width:100%;padding:17px;border-radius:var(--r);font-family:var(--font-d);font-weight:700;font-size:16px;letter-spacing:.03em;text-align:center}
.big.primary{background:var(--text);color:var(--bg)}
.big.ghost{background:var(--surface);border:1px solid var(--border);margin-top:10px}
.big:active{transform:scale(.98)}
.sea{margin-top:30px}
.sea h2{font-family:var(--font-d);font-weight:800;font-size:22px;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sea h2 small{font-family:var(--font-b);font-weight:400;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{position:relative;text-align:left;padding:14px 14px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--border);min-height:92px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc)}
.rc .n{font-family:var(--font-d);font-weight:800;font-size:14.5px;line-height:1.15;letter-spacing:.01em}
.rc .s{font-size:12px;color:var(--muted);margin-top:4px}
.rc .st{font-size:12px;color:var(--dim);margin-top:8px;font-family:var(--font-d);font-weight:700}
.rc.done .st{color:var(--rc)}
.rc:active{transform:scale(.97)}

/* round intro */
.intro{text-align:center;padding:50px 0 10px}
.intro .b{display:inline-block;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.intro h2{font-family:var(--font-d);font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1;margin:20px 0 10px;color:var(--c)}
.intro .sn{font-size:16px;color:var(--muted)}
.intro .f{margin:26px auto 34px;max-width:400px;font-size:17px}

/* question */
.prog{display:flex;gap:5px;margin:4px 0 20px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--border)}
.prog i.d{background:var(--c)}.prog i.cur{background:color-mix(in srgb,var(--c) 50%,var(--border))}
.qn{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--c);text-transform:uppercase;margin-bottom:10px}
.qt{font-size:21px;line-height:1.38;font-weight:500;white-space:pre-line}
.media{margin:18px 0 4px;border-radius:14px;overflow:hidden;background:var(--surface)}
.media img{display:block;width:100%;max-height:52vh;object-fit:contain;background:#000}
.yt{position:relative;aspect-ratio:16/9;background:#000}
.yt iframe,.yt>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .cover{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 30%,#111) ,#0b0b0f 75%);font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.yt .cover .eq{display:flex;gap:4px;height:34px;align-items:flex-end}
.yt .cover .eq b{width:6px;background:var(--c);border-radius:3px;height:30%}
.yt.playing .cover .eq b{animation:eq .9s ease-in-out infinite}
.yt.playing .cover .eq b:nth-child(2){animation-delay:.15s}.yt.playing .cover .eq b:nth-child(3){animation-delay:.3s}.yt.playing .cover .eq b:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.clipbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-family:var(--font-d);font-weight:700;font-size:14px;margin-top:10px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:15px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);font-size:16.5px;line-height:1.3}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--muted)}
.opt:active{transform:scale(.985)}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.opt.right .l{background:var(--green);color:#000}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface))}
.opt.wrong .l{background:var(--red);color:#fff}
.opts.locked .opt:not(.right):not(.wrong){opacity:.45}

/* reveal */
.rev{scroll-margin-top:72px;margin-top:24px;padding:22px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);animation:fade .3s ease}
.rev .verdict{font-family:var(--font-d);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.rev .verdict.y{color:var(--green)}.rev .verdict.n{color:var(--red)}.rev .verdict.u{color:var(--muted)}
.rev .ans{font-family:var(--font-d);font-weight:800;font-size:26px;line-height:1.1;color:var(--green)}
.rev .sub{color:var(--muted);font-size:14.5px;margin-top:8px}
.rev .media{margin:16px 0 0}
.rev ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:9px}
.rev li{position:relative;padding-left:16px;font-size:15.5px}
.rev li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.rev .src{margin-top:14px;font-size:12px;color:var(--dim)}

/* sticky footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.foot .big{margin:0}
.btn-y{background:var(--green);color:#04130a}
.btn-n{background:var(--surface2);border:1px solid var(--border)}
.btn-c{background:var(--c);color:#0b0b0f}

/* end */
.end{text-align:center;padding:46px 0 10px}
.end .big-score{font-family:var(--font-d);font-weight:800;font-size:84px;line-height:1;color:var(--c)}
.end .of{color:var(--muted);margin-top:6px}
.end .msg{font-size:19px;margin:22px auto 30px;max-width:380px}
.recap{text-align:left;margin:0 0 28px;display:grid;gap:8px}
.recap div{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--surface);font-size:14.5px}
.recap b{flex:none;font-family:var(--font-d)}
.recap .y b{color:var(--green)}.recap .n b{color:var(--red)}

.foot-note{text-align:center;color:var(--dim);font-size:12px;margin-top:40px;font-family:var(--font-d);letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="wrap">
    <div class="hero">
      <div class="k">The Archive · Seasons I to III</div>
      <h1>SO YOU THINK<span>YOU KNOW THINGS</span></h1>
      <p>Every question from the first three seasons. Play a round, play a season, or let it pick for you.</p>
    </div>
    <button class="big primary" onclick="startMix()">Quick game · 10 random questions</button>
    <div id="seasons"></div>
    <div class="foot-note">sara behar</div>
  </div>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="bar"><div class="in">
    <button class="icon" onclick="goHome()" aria-label="Back to rounds">←</button>
    <div class="t" id="barTitle"></div>
    <div class="score" id="barScore"></div>
  </div></div>
  <div class="wrap" id="stage"></div>
  <div class="foot"><div class="in" id="foot"></div></div>
</section>

<script src="questions.js"></script>
<script>
/* ───────── state (in memory only, nothing is saved) ───────── */
const results = {};          // roundId -> {score, total}
let run = null;              // {title, color, items:[{round, q}], i, score, log:[], roundId|null, answered}
let ytApiReady = false, ytQueue = [], players = {};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allRounds = () => SEASONS.flatMap(s => s.rounds.map(r => ({...r, season: s})));

/* ───────── home ───────── */
function renderHome(){
  $('seasons').innerHTML = SEASONS.map(s => `
    <div class="sea">
      <h2>${esc(s.label)} <small>${esc(s.when)}</small></h2>
      <div class="grid">
        ${s.rounds.map(r => {
          const res = results[r.id];
          const st = res ? `${res.score} / ${res.total}` : (r.bonus ? 'Bonus' : `${r.questions.length} questions`);
          return `<button class="rc ${res?'done':''}" style="--rc:${r.color}" onclick="startRound('${r.id}')">
            <div><div class="n">${esc(r.name)}</div>${r.subname?`<div class="s">${esc(r.subname)}</div>`:''}</div>
            <div class="st">${res?'✓ ':''}${st}</div></button>`;
        }).join('')}
      </div>
    </div>`).join('');
}
function goHome(){
  if (run && run.i < run.items.length && run.i > 0 && !confirm('Leave this round? Your progress in it will be lost.')) return;
  stopAll(); run = null;
  show('home'); renderHome(); window.scrollTo(0,0);
}
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

/* ───────── starting ───────── */
function startRound(id){
  const r = allRounds().find(x => x.id === id);
  run = {title:`${r.season.label} · ${r.name}`, color:r.color, round:r,
         items:r.questions.map(q => ({round:r, q})), i:0, score:0, log:[], roundId:id};
  show('play'); setColor(r.color); renderIntro();
}
function startMix(){
  const pool = allRounds().flatMap(r => r.questions.map(q => ({round:r, q})));
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.random()*(i+1)|0; [pool[i],pool[j]] = [pool[j],pool[i]]; }
  run = {title:'Quick game', color:'#a855f7', round:null, items:pool.slice(0,10), i:0, score:0, log:[], roundId:null};
  show('play'); setColor(run.color); renderQuestion();
}
function setColor(c){ document.documentElement.style.setProperty('--c', c); }

function renderIntro(){
  const r = run.round;
  $('barTitle').textContent = r.season.label; $('barScore').textContent = '';
  $('stage').innerHTML = `<div class="intro">
    <span class="b">${esc(r.season.label)}${r.bonus?' · Bonus':''}</span>
    <h2>${esc(r.name)}</h2>
    ${r.subname?`<div class="sn">${esc(r.subname)}</div>`:''}
    <p class="f">${esc(r.format)}</p></div>`;
  $('foot').innerHTML = `<button class="big btn-c" onclick="renderQuestion()">Start · ${r.questions.length} question${r.questions.length>1?'s':''}</button>`;
  window.scrollTo(0,0);
}

/* ───────── question ───────── */
function renderQuestion(){
  stopAll();
  const {round, q} = run.items[run.i];
  if (!run.round) setColor(round.color);
  run.answered = false;
  $('barTitle').textContent = run.round ? round.name : `${round.season.label} · ${round.name}`;
  $('barScore').textContent = `${run.score} pts`;
  const prog = run.items.map((_,k) => `<i class="${k<run.i?'d':k===run.i?'cur':''}"></i>`).join('');
  const mc = q.options.length > 0;
  $('stage').innerHTML = `
    <div class="prog">${prog}</div>
    <div class="qn">Question ${run.i+1} of ${run.items.length}</div>
    <div class="qt">${esc(q.q)}</div>
    ${mediaHTML(q.media, 'qm', true)}
    ${mc ? `<div class="opts" id="opts">${q.options.map((o,k)=>`
      <button class="opt" onclick="pick(${k})"><span class="l">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>` : ''}
    <div id="rev"></div>`;
  $('foot').innerHTML = mc ? '' : `<button class="big btn-c" onclick="reveal(null)">Show answer</button>`;
  mountMedia(q.media, 'qm', true);
  window.scrollTo(0,0);
}

function pick(k){
  if (run.answered) return;
  const q = run.items[run.i].q;
  const opts = [...document.querySelectorAll('#opts .opt')];
  $('opts').classList.add('locked');
  opts[q.correct].classList.add('right');
  if (k !== q.correct) opts[k].classList.add('wrong');
  reveal(k === q.correct);
}

/* got: true / false for multiple choice, null for open questions (player marks themselves) */
function reveal(got){
  run.answered = true;
  const {q} = run.items[run.i];
  const verdict = got === true ? '<div class="verdict y">Correct</div>'
                : got === false ? '<div class="verdict n">Not quite</div>'
                : '<div class="verdict u">The answer</div>';
  $('rev').innerHTML = `<div class="rev">${verdict}
    <div class="ans">${esc(q.answer)}</div>
    ${q.sub?`<div class="sub">${esc(q.sub)}</div>`:''}
    ${q.img?`<div class="media"><img src="${esc(q.img)}" alt="" loading="lazy"></div>`:''}
    ${mediaHTML(q.amedia, 'am', false)}
    ${q.note.length?`<ul>${q.note.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
    ${q.source?`<div class="src">Source: ${esc(q.source)}</div>`:''}
  </div>`;
  if (players.qm) { try { players.qm.pauseVideo(); } catch(e){} }
  mountMedia(q.amedia, 'am', false);
  if (got === null){
    $('foot').innerHTML = `<button class="big btn-n" onclick="score(false)">Missed it</button>
                           <button class="big btn-y" onclick="score(true)">Got it</button>`;
  } else {
    if (got) run.score++;
    run.log.push({q, got});
    $('barScore').textContent = `${run.score} pts`;
    $('foot').innerHTML = `<button class="big btn-c" onclick="next()">${run.i+1<run.items.length?'Next question':'See score'}</button>`;
  }
  setTimeout(() => $('rev').scrollIntoView({behavior:'smooth', block:'start'}), 60);
}
function score(got){
  if (got) run.score++;
  run.log.push({q: run.items[run.i].q, got});
  next();
}
function next(){
  run.i++;
  if (run.i < run.items.length) renderQuestion(); else renderEnd();
}

/* ───────── end of round ───────── */
function renderEnd(){
  stopAll();
  const n = run.items.length, s = run.score;
  if (run.roundId) results[run.roundId] = {score:s, total:n};
  const pct = s / n;
  const msg = pct === 1 ? 'Clean sweep. You do know things.'
            : pct >= .7 ? 'Strong. The room would be nervous.'
            : pct >= .4 ? 'Respectable. Some of these were mean.'
            : 'Rough one. Now you know things.';
  $('barScore').textContent = '';
  $('stage').innerHTML = `<div class="end">
    <div class="big-score">${s}</div><div class="of">out of ${n}</div>
    <p class="msg">${msg}</p></div>
    <div class="recap">${run.log.map(l=>`<div class="${l.got?'y':'n'}"><b>${l.got?'✓':'✗'}</b><span>${esc(l.q.answer)}</span></div>`).join('')}</div>`;
  const nextR = run.roundId ? nextRound(run.roundId) : null;
  $('foot').innerHTML = run.roundId
    ? `<button class="big btn-n" onclick="run=null;goHome()">All rounds</button>
       ${nextR?`<button class="big btn-c" onclick="startRound('${nextR.id}')">Next round</button>`:''}`
    : `<button class="big btn-n" onclick="run=null;goHome()">All rounds</button>
       <button class="big btn-c" onclick="startMix()">Play again</button>`;
  window.scrollTo(0,0);
}
function nextRound(id){
  const all = allRounds(); const k = all.findIndex(r => r.id === id);
  return all[k+1] || null;
}

/* ───────── media: images + YouTube (audio clips stay covered) ───────── */
function mediaHTML(m, slot, isQuestion){
  if (!m) return '';
  if (m.kind === 'img') return `<div class="media"><img src="${esc(m.src)}" alt="" loading="lazy"></div>`;
  const covered = isQuestion && !m.video;
  return `<div class="media"><div class="yt" id="${slot}-box"><div id="${slot}-player"></div>
    ${covered?`<div class="cover"><div class="eq"><b></b><b></b><b></b><b></b></div><div>Listen</div></div>`:''}</div></div>
    ${covered?`<button class="clipbtn" id="${slot}-btn" onclick="toggleClip('${slot}')">▶ Play clip</button>`:''}`;
}
function mountMedia(m, slot){
  if (!m || m.kind !== 'yt') return;
  const make = () => {
    players[slot] = new YT.Player(`${slot}-player`, {
      videoId: m.id,
      playerVars: {start: m.start || 0, playsinline: 1, rel: 0, modestbranding: 1, controls: 1},
      events: {onStateChange: e => {
        const box = $(`${slot}-box`), btn = $(`${slot}-btn`);
        const playing = e.data === YT.PlayerState.PLAYING;
        if (box) box.classList.toggle('playing', playing);
        if (btn) btn.textContent = playing ? '❚❚ Pause' : '▶ Play clip';
      }}
    });
  };
  ytApiReady ? make() : ytQueue.push(make);
}
function toggleClip(slot){
  const p = players[slot]; if (!p || !p.getPlayerState) return;
  p.getPlayerState() === YT.PlayerState.PLAYING ? p.pauseVideo() : p.playVideo();
}
function stopAll(){
  for (const k in players){ try { players[k].destroy(); } catch(e){} }
  players = {};
}
window.onYouTubeIframeAPIReady = () => { ytApiReady = true; ytQueue.splice(0).forEach(f => f()); };
(function(){ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

renderHome();
</script>
</body>
</html>
