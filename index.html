<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>SO YOU THINK YOU KNOW THINGS · The Archive</title>
<meta name="description" content="Play past seasons of So You Think You Know Things on your phone.">
<style>
@font-face{font-family:'Inter Tight';font-weight:700;font-display:swap;src:url(fonts/inter-tight-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-weight:800;font-display:swap;src:url(fonts/inter-tight-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}

/* ═══ Same system as the live quiz: Sleek Stage + Glass layer ═══ */
:root{
  --bg:#08080b; --pink:#ff3d8b; --cyan:#5de6ff; --red:#ff5a6e;
  --text:#fff; --muted:#b4b4c8; --dim:#6d6d80;
  --glass:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  --glass-b:rgba(255,255,255,.16);
  --d:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --b:'DM Sans','Helvetica Neue',Arial,sans-serif;
  --c:#ff3d8b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--b);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden}
#aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#aurora i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform}
#aurora i:nth-child(1){width:85vw;height:85vw;left:-30vw;top:-20vw;background:#ff3d8b;animation:b1 19s ease-in-out infinite}
#aurora i:nth-child(2){width:80vw;height:80vw;right:-35vw;top:10vh;background:#6e50ff;animation:b2 23s ease-in-out infinite}
#aurora i:nth-child(3){width:90vw;height:70vw;left:5vw;bottom:-35vw;background:#7a3cff;opacity:.4;animation:b3 27s ease-in-out infinite}
#aurora i:nth-child(4){width:60vw;height:60vw;left:-25vw;bottom:10vh;background:#ff468c;opacity:.28;animation:b2 31s ease-in-out infinite reverse}
@keyframes b1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes b2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-16vw,10vh) scale(.9)}}
@keyframes b3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,-12vh) scale(1.1)}}
body.dim #aurora{opacity:.55;transition:opacity .6s}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(3vw,-2vh,0)}}
@media (prefers-reduced-motion:reduce){#aurora i,.welcome h1,.welcome h1 .ln{animation:none!important}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
.screen{display:none;position:relative;z-index:1}.screen.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:520px;margin:0 auto;padding:16px 20px 130px}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 40px -20px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.track{font-family:var(--b);font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.display{font-family:var(--d);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:.92}
.pill{display:block;width:100%;padding:16px 20px;border-radius:999px;font-family:var(--d);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.pill:active{transform:scale(.98)}
.pill.white{background:#fff;color:var(--bg)}
.pill.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.pill.cyan{background:var(--cyan);color:var(--bg)}
.credit{text-align:center;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.3em}

/* ── welcome: the quiz's title screen, for a phone ── */
.welcome{min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(30px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.w-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.w-mast{color:var(--pink);font-size:17px;font-weight:700;letter-spacing:.5em;padding-left:.5em;text-shadow:0 0 18px rgba(255,61,139,.55)}
.welcome h1{font-size:clamp(58px,18.5vw,92px);margin-top:20px;line-height:.88;
  filter:drop-shadow(0 0 24px rgba(255,61,139,.35)) drop-shadow(0 0 60px rgba(124,58,237,.35));animation:float 6s ease-in-out 1.5s infinite}
.welcome h1 .ln{background:linear-gradient(100deg,#fff 0%,#fff 38%,#ffb3d1 46%,#fff 50%,#c9b8ff 54%,#fff 62%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:rise .8s cubic-bezier(.2,.7,.2,1) var(--d) both,sheen 5s ease-in-out calc(var(--d) + 1.2s) infinite}
.welcome h1 .ln:nth-child(3){background-image:linear-gradient(100deg,#ff468c,#c04fd8 50%,#8f6dff 70%,#ff468c);background-size:200% 100%;animation:rise .8s cubic-bezier(.2,.7,.2,1) var(--d) both,flow 6s linear infinite}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.welcome h1 .ln{display:block}
.w-in{animation:up .7s cubic-bezier(.2,.7,.2,1) var(--d) both}
@keyframes rise{from{opacity:0;transform:translateY(40%);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.chips{display:flex;gap:8px;margin-top:22px}
.chip{padding:10px 12px;border-radius:14px;min-width:84px;text-align:center}
.chip b{display:block;font-family:var(--d);font-weight:800;font-size:22px;line-height:1;letter-spacing:-.02em}
.chip span{display:block;margin-top:6px;font-size:9px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;font-weight:500}
@keyframes psGlow{0%,100%{text-shadow:0 0 14px rgba(255,61,139,.7),0 0 34px rgba(124,58,237,.4);opacity:1}50%{text-shadow:0 0 26px rgba(255,61,139,1),0 0 60px rgba(124,58,237,.7);opacity:.85}}
.start{display:block;width:100%;padding:18px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,61,139,.45);
  box-shadow:0 0 0 0 rgba(255,61,139,.4),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  font-family:var(--d);font-weight:800;font-size:17px;letter-spacing:.3em;text-transform:uppercase;text-align:center;animation:up .7s cubic-bezier(.2,.7,.2,1) var(--d) both,ring 2.4s ease-in-out 2s infinite}
.start span{display:inline-block;animation:psGlow 1.8s ease-in-out infinite;padding-left:.3em}
.start:active{transform:scale(.98)}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(255,61,139,.0),inset 0 1px 0 rgba(255,255,255,.18)}50%{box-shadow:0 0 0 6px rgba(255,61,139,.18),0 0 40px rgba(255,61,139,.25),inset 0 1px 0 rgba(255,255,255,.18)}}
.w-season{color:var(--pink);letter-spacing:.55em;margin-top:18px;font-size:12px;padding-left:.55em}
.w-rule{width:160px;margin-top:28px!important;height:3px;border-radius:2px;margin:22px 0 0;background:linear-gradient(90deg,#ff468c,#c04fd8 55%,#8f6dff);transform-origin:center;animation:draw .8s cubic-bezier(.2,.7,.2,1) .8s both;box-shadow:0 0 18px rgba(255,61,139,.5)}
.w-count{margin-top:20px;color:var(--muted);font-size:15px}
.w-actions{width:100%;display:grid;gap:10px}
.w-actions .credit{margin-top:16px}

/* ── top bar ── */
.bar{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:rgba(8,8,11,.55);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.08)}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px}
.bar .t{flex:1;min-width:0;font-family:var(--d);font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .score{font-family:var(--d);font-weight:800;font-size:15px;color:var(--c);font-variant-numeric:tabular-nums}
.icon{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);font-size:15px}

/* ── rounds ── */
.tabs{max-width:520px;margin:0 auto;display:flex;gap:6px;padding:2px 20px 12px}
.tab{flex:1;min-width:0;padding:9px 0;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);font-family:var(--d);font-weight:800;font-size:13px;letter-spacing:.06em;text-align:center;color:var(--muted)}
.tab.on{background:#fff;color:var(--bg);border-color:#fff}
.sea-h{text-align:center;padding:18px 0 18px}
.sea-h h2{font-size:34px}
.sea-h .track{color:var(--pink);margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:118px;padding:14px 14px 13px 17px;border-radius:18px;text-align:left}
.rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc);opacity:.9}
.rc .bd{color:var(--rc);font-size:10px;letter-spacing:.24em}
.rc .n{font-size:18px;line-height:1.02;letter-spacing:-.02em;margin:6px 0 0;overflow-wrap:anywhere}
.rc .m{font-size:10px;letter-spacing:.14em;color:var(--dim);margin-top:9px}
.rc.done .m{color:var(--rc)}
.rc:active{transform:scale(.97)}
.rc{animation:up .5s cubic-bezier(.2,.7,.2,1) calc(var(--i)*45ms) both}
.sea-h h2{text-shadow:0 0 40px rgba(255,61,139,.35)}
.sea-h .prog-s{margin-top:12px;font-size:12px;color:var(--muted)}
.rc.wide{grid-column:1/-1;min-height:96px}
.s4lock{text-align:center;padding:80px 10px}
.s4lock .lk{font-size:36px}
.s4lock h2{font-size:34px;margin:16px 0 10px}
.s4lock p{color:var(--muted)}

/* ── round intro ── */
.intro{position:relative;text-align:center;min-height:calc(100dvh - 230px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0}
.intro .num{position:absolute;left:0;right:0;top:50%;transform:translateY(-78%);font-family:var(--d);font-weight:800;font-size:200px;line-height:1;color:var(--c);opacity:.08;letter-spacing:-.04em;pointer-events:none}
.intro .badge{position:relative;display:inline-block;padding:8px 18px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:rgba(255,255,255,.06);padding-left:calc(18px + .35em);letter-spacing:.35em}
.intro .num{animation:numIn 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes numIn{from{opacity:0;transform:translateY(-60%) scale(1.25)}}
.intro .badge{animation:up .6s .15s both}.intro h2{animation:rise .8s cubic-bezier(.2,.7,.2,1) .25s both}.intro .sn{animation:up .6s .5s both}
.intro h2{position:relative;text-shadow:0 0 50px color-mix(in srgb,var(--c) 45%,transparent);font-size:clamp(40px,12vw,56px);margin:22px 0 14px;overflow-wrap:anywhere}
.intro .sn{position:relative;color:var(--muted);font-size:17px}

/* ── question ── */
.prog{height:3px;border-radius:3px;background:rgba(255,255,255,.1);margin:8px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);transition:width .4s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qpill{padding:6px 13px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:rgba(255,255,255,.06);letter-spacing:.24em}
.qcount{color:#8a8a9e;font-size:14px;font-weight:500}
.qcard{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.qcard::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--c),transparent 70%)}
.qt{font-family:var(--d);font-weight:700;font-size:23px;line-height:1.18;letter-spacing:-.02em;white-space:pre-line}
.media{margin-top:16px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--glass-b)}
.media img{display:block;width:100%;max-height:46vh;object-fit:contain}
.yt{position:relative;aspect-ratio:16/9;background:#000}
.yt iframe,.yt>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .cover{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 32%,#0c0c11),#08080b 75%)}
.yt .cover .eq{display:flex;gap:5px;height:34px;align-items:flex-end}
.yt .cover .eq b{width:6px;background:var(--c);border-radius:3px;height:30%}
.yt.playing .cover .eq b{animation:eq .9s ease-in-out infinite}
.yt.playing .cover .eq b:nth-child(2){animation-delay:.15s}.yt.playing .cover .eq b:nth-child(3){animation-delay:.3s}.yt.playing .cover .eq b:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.clipbtn{margin-top:12px}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--glass-b);color:#e8e8f2;font-weight:500;font-size:16px;line-height:1.3}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);font-family:var(--d);font-weight:800;font-size:12px;color:var(--muted)}
.opt.right{border-color:var(--cyan);color:var(--cyan);background:rgba(93,230,255,.08);box-shadow:0 0 24px rgba(93,230,255,.25);animation:hit .5s cubic-bezier(.2,.7,.2,1)}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.opt{transition:opacity .3s}
.opt.right .l{border-color:var(--cyan);color:var(--cyan)}
.opts.locked .opt:not(.right){opacity:.35}

/* ── answer ── */
.rev{scroll-margin-top:76px;margin-top:14px;animation:fade .35s ease}
.rev .lab{color:var(--c)}
.rev .ans{font-size:clamp(34px,10vw,46px);margin-top:12px;overflow-wrap:anywhere;animation:rise .7s cubic-bezier(.2,.7,.2,1) .1s both;text-shadow:0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.rev .sub,.rev .stat,.rev .media,.rev ul{animation:up .5s .3s both}
.rev .sub{color:#d2d2e2;font-size:15px;margin-top:10px}
.rev .stat{margin-top:16px;text-align:center;padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--glass-b)}
.rev .stat b{display:block;font-family:var(--d);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em;color:var(--c)}
.rev .stat span{display:block;margin-top:8px;color:#c8c8da;font-size:13px}
.rev ul{list-style:none;margin-top:18px;padding-left:14px;border-left:2px solid var(--c);display:grid;gap:10px}
.rev li{color:#d2d2e2;font-size:15px}
.rev .src{margin-top:16px;font-size:12px;color:var(--dim)}

/* ── footer actions ── */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:26px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(8,8,11,0),rgba(8,8,11,.92) 40%)}
.foot .in{max-width:520px;margin:0 auto;display:flex;gap:10px}
.foot .in:empty{display:none}

/* ── round end ── */
.end{text-align:center;padding:56px 0 8px}
.end .track{color:var(--c)}
.end .big{text-shadow:0 0 60px color-mix(in srgb,var(--c) 50%,transparent);font-family:var(--d);font-weight:800;font-size:120px;line-height:1;letter-spacing:-.04em;margin-top:14px}
.end .big small{font-size:40px;color:var(--dim);letter-spacing:-.02em}
.end .msg{font-family:var(--d);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:-.02em;margin:18px 0 26px}
.recap{border-radius:20px;overflow:hidden}
.recap div{display:flex;gap:12px;align-items:baseline;padding:13px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:14.5px}
.recap div:first-child{border-top:0}
.recap b{flex:none;width:14px;font-family:var(--d)}
.recap .y b{color:var(--cyan)}.recap .n b{color:var(--red)}
</style>
</head>
<body>
<div id="aurora"><i></i><i></i><i></i><i></i></div>
<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none"></canvas>

<!-- WELCOME -->
<section class="screen on" id="welcome">
  <div class="welcome">
    <div class="w-main">
      <div class="track w-mast w-in" style="--d:.05s">The Archive</div>
      <h1 class="display"><span class="ln" style="--d:.15s">So you</span><span class="ln" style="--d:.25s">think you</span><span class="ln" style="--d:.35s">know</span><span class="ln" style="--d:.45s">things</span></h1>
      <div class="w-rule"></div>
    </div>
    <div class="w-actions">
      <button class="start w-in" style="--d:1.15s" onpointerdown="yeah()" onclick="openRounds()"><span>▶︎&nbsp; Press to start</span></button>
      <button class="pill ghost w-in" style="--d:1.25s" onclick="startMix()">Quick game · 10 questions</button>
      <div class="credit w-in" style="--d:1.35s">sara behar</div>
    </div>
  </div>
</section>

<!-- ROUNDS -->
<section class="screen" id="home">
  <div class="bar"><div class="in">
    <button class="icon" onclick="show('welcome');window.scrollTo(0,0)" aria-label="Back">←</button>
    <div class="t">Choose a round</div>
  </div>
  <div class="tabs" id="tabs"></div></div>
  <div class="wrap" id="seasons"></div>
</section>

<!-- PLAY -->
<section class="screen" id="play">
  <div class="bar"><div class="in">
    <button class="icon" onclick="goHome()" aria-label="Back to rounds">←</button>
    <div class="t" id="barTitle"></div>
    <div class="score" id="barScore"></div>
  </div></div>
  <div class="wrap" id="stage"></div>
  <div class="foot"><div class="in" id="foot"></div></div>
</section>

<script src="questions.js"></script>
<script>
/* ───────── state (in memory only, nothing is saved) ───────── */
const results = {};
let run = null, curSeason = 0, s4Open = false;
let ytApiReady = false, ytQueue = [], players = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROMAN = ['','I','II','III','IV','V','VI','VII'];

/* Same round colours as the live quiz: pink to violet across the night, white for the bonus */
const ROUND_COLORS = ['#ff468c','#f34a99','#e84fa6','#dc53b2','#d058bf','#c55ccc','#b961d9','#ad65e5','#a26af2','#966eff'];
function paint(season){
  let k = 0;
  season.rounds.forEach(r => { r.color = r.bonus ? '#ffffff' : ROUND_COLORS[Math.min(k++, 9)]; r.no = r.bonus ? 0 : k; });
}
SEASONS.forEach(paint);
const allRounds = () => SEASONS.flatMap(s => s.rounds.map(r => ({...r, season: s})));
const soft = s => (s && s === s.toUpperCase() && /[A-Z]{3}/.test(s)) ? s.charAt(0)+s.slice(1).toLowerCase() : s;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function setColor(c){ document.documentElement.style.setProperty('--c', c); }

/* ───────── the "yeah" from the live quiz's PRESS TO START ─────────
   Web Audio, decoded as the page loads, fired on finger-down: no iPhone lag. */
const YEAH_VOLUME = 0.4;
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, yeahBuf = null;
try {
  actx = AC ? new AC() : null;
  if (actx) fetch('assets/yeah.mp3').then(r => r.arrayBuffer())
    .then(ab => new Promise((ok, no) => actx.decodeAudioData(ab, ok, no)))
    .then(b => { yeahBuf = b; }).catch(() => {});
} catch(e) { actx = null; }
/* wake the audio engine on the very first touch anywhere, so the start button is instant */
document.addEventListener('pointerdown', function wake(){
  try { if (actx && actx.state !== 'running') actx.resume(); } catch(e){}
  document.removeEventListener('pointerdown', wake, true);
}, true);
let yeahFallback = null;
function yeah(){
  try {
    if (actx && yeahBuf){
      if (actx.state !== 'running') actx.resume();
      const src = actx.createBufferSource(), g = actx.createGain();
      g.gain.value = YEAH_VOLUME; src.buffer = yeahBuf;
      src.connect(g); g.connect(actx.destination); src.start(0);
      return;
    }
    yeahFallback = yeahFallback || new Audio('assets/yeah.mp3');
    yeahFallback.volume = YEAH_VOLUME; yeahFallback.currentTime = 0; yeahFallback.play().catch(()=>{});
  } catch(e){}
}

/* ───────── welcome ───────── */
function updateWelcome(){
  const n = SEASONS.reduce((a,s) => a + s.rounds.reduce((b,r) => b + r.questions.length, 0), 0);
  const rounds = SEASONS.reduce((a,s) => a + s.rounds.filter(r => !r.bonus).length, 0);

}

/* ───────── rounds ───────── */
function openRounds(){ show('home'); setColor('#ff3d8b'); renderHome(); window.scrollTo(0,0); }
function renderHome(){
  const tabs = SEASONS.map((s,k) =>
    `<button class="tab ${k===curSeason?'on':''}" onclick="curSeason=${k};renderHome();window.scrollTo(0,0)">${ROMAN[k+1]}</button>`);
  $('tabs').innerHTML = tabs.join('');
  const s = SEASONS[curSeason];
  $('seasons').innerHTML = `
    <div class="sea-h"><h2 class="display">${esc(s.label)}</h2>
      <div class="prog-s">${s.rounds.filter(r=>results[r.id]).length} of ${s.rounds.length} rounds played</div></div>
    <div class="grid">${s.rounds.map(r => {
      const res = results[r.id];
      const meta = res ? `✓ ${res.score} / ${res.total}` : `${r.questions.length} question${r.questions.length===1?'':'s'}`;
      return `<button class="rc glass ${res?'done':''} ${r.bonus?'wide':''}" style="--rc:${r.color};--i:${s.rounds.indexOf(r)}" onclick="startRound('${r.id}')">
        <div class="bd track">${r.bonus ? 'Bonus' : 'Round ' + r.no}</div>
        <div class="n display">${esc(r.name)}</div>
        <div class="m track">${meta}</div></button>`;
    }).join('')}</div>`;
}
function goHome(){
  if (run && run.i < run.items.length && run.i > 0 && !confirm('Leave this round? Your progress in it will be lost.')) return;
  stopAll(); run = null; openRounds();
}

/* ───────── starting ───────── */
function startRound(id){
  const r = allRounds().find(x => x.id === id);
  curSeason = SEASONS.indexOf(r.season);
  run = {round:r, items:r.questions.map(q => ({round:r, q})), i:0, score:0, log:[], roundId:id};
  show('play'); setColor(r.color); renderIntro();
}
function startMix(){
  const pool = allRounds().flatMap(r => r.questions.map(q => ({round:r, q})));
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.random()*(i+1)|0; [pool[i],pool[j]] = [pool[j],pool[i]]; }
  run = {round:null, items:pool.slice(0,10), i:0, score:0, log:[], roundId:null};
  show('play'); renderQuestion();
}
function renderIntro(){
  const r = run.round;
  $('barTitle').textContent = r.season.label; $('barScore').textContent = '';
  $('stage').innerHTML = `<div class="intro">
    <div class="num">${r.bonus ? '★' : String(r.no).padStart(2,'0')}</div>
    <span class="badge track">${r.bonus ? 'Bonus' : 'Round ' + r.no}</span>
    <h2 class="display">${esc(r.name)}</h2>
    ${(r.subname || r.format) ? `<div class="sn">${esc(soft(r.subname) || r.format)}</div>` : ''}</div>`;
  $('foot').innerHTML = `<button class="pill white" onclick="renderQuestion()">Begin →</button>`;
  window.scrollTo(0,0);
}

/* ───────── question ───────── */
function renderQuestion(){
  stopAll();
  const {round, q} = run.items[run.i];
  setColor(round.color);
  run.answered = false;
  $('barTitle').textContent = run.round ? round.name : 'Quick game';
  $('barScore').textContent = `${run.score} ${run.score===1?'pt':'pts'}`;
  $('stage').innerHTML = `
    <div class="prog"><i style="width:${(run.i/run.items.length)*100}%"></i></div>
    <div class="qhead"><span class="qpill track">${run.round ? (round.bonus ? 'Bonus' : 'Round ' + round.no) : esc(round.season.label + ' · ' + round.name)}</span>
      <span class="qcount">${run.i+1} / ${run.items.length}</span></div>
    <div class="qcard glass">
      <div class="qt">${esc(q.q)}</div>
      ${mediaHTML(q.media, 'qm', true)}
      ${q.options.length ? `<div class="opts" id="opts">${q.options.map((o,k)=>`
        <div class="opt"><span class="l">${'ABCD'[k]}</span><span>${esc(o)}</span></div>`).join('')}</div>` : ''}
    </div>
    <div id="rev"></div>`;
  $('foot').innerHTML = `<button class="pill white" onclick="reveal()">Show answer</button>`;
  mountMedia(q.media, 'qm');
  window.scrollTo(0,0);
}

/* every question reveals the same way: show the answer, then the player marks themselves */
function reveal(){
  if (run.answered) return;
  run.answered = true;
  const {q} = run.items[run.i];
  if (q.options.length){
    $('opts').classList.add('locked');
    const o = $('opts').children[q.correct]; if (o) o.classList.add('right');
  }
  $('rev').innerHTML = `<div class="rev qcard glass">
    <div class="lab track">The answer</div>
    <div class="ans display">${esc(q.answer)}</div>
    ${q.sub?`<div class="sub">${esc(q.sub)}</div>`:''}
    ${q.stat?`<div class="stat"><b>${esc(q.stat)}</b>${q.statLabel?`<span>${esc(q.statLabel)}</span>`:''}</div>`:''}
    ${q.img?`<div class="media"><img src="${esc(q.img)}" alt="" loading="lazy"></div>`:''}
    ${mediaHTML(q.amedia, 'am', false)}
    ${q.note.length?`<ul>${q.note.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
    ${q.source?`<div class="src">Source: ${esc(q.source)}</div>`:''}
  </div>`;
  if (players.qm) { try { players.qm.pauseVideo(); } catch(e){} }
  mountMedia(q.amedia, 'am');
  $('foot').innerHTML = `<button class="pill ghost" onclick="score(false)">Missed it</button>
                         <button class="pill cyan" onclick="score(true)">Got it</button>`;
  setTimeout(() => $('rev').scrollIntoView({behavior:'smooth', block:'start'}), 60);
}
function score(got){
  if (got) run.score++;
  run.log.push({q: run.items[run.i].q, got});
  run.i++;
  if (run.i < run.items.length) renderQuestion(); else renderEnd();
}

/* ───────── round end ───────── */
function renderEnd(){
  stopAll();
  const n = run.items.length, s = run.score;
  if (run.roundId) results[run.roundId] = {score:s, total:n};
  const pct = s / n;
  const msg = pct === 1 ? 'Clean sweep' : pct >= .7 ? 'You know things' : pct >= .4 ? 'Respectable' : 'Now you know things';
  if (!run.round) setColor('#ff3d8b');
  $('barScore').textContent = '';
  $('stage').innerHTML = `<div class="end">
    <div class="track">${run.round ? esc(run.round.name) : 'Quick game'}</div>
    <div class="big"><span id="cnt">0</span><small> / ${n}</small></div>
    <div class="msg">${msg}</div></div>
    <div class="recap glass">${run.log.map(l=>`<div class="${l.got?'y':'n'}"><b>${l.got?'✓':'✗'}</b><span>${esc(l.q.answer)}</span></div>`).join('')}</div>`;
  let c = 0; const step = () => { if (!$('cnt')) return; $('cnt').textContent = c; if (c++ < s) setTimeout(step, 700 / Math.max(s,1)); }; step();
  if (pct >= .6) setTimeout(() => flecks(pct === 1 ? 260 : 120), 500);
  const all = allRounds(), k = run.roundId ? all.findIndex(r => r.id === run.roundId) : -1;
  const nextR = k >= 0 ? all[k+1] : null;
  $('foot').innerHTML = run.roundId
    ? `<button class="pill ghost" onclick="run=null;openRounds()">All rounds</button>
       ${nextR?`<button class="pill white" onclick="startRound('${nextR.id}')">Next round →</button>`:''}`
    : `<button class="pill ghost" onclick="run=null;openRounds()">All rounds</button>
       <button class="pill white" onclick="startMix()">Play again</button>`;
  window.scrollTo(0,0);
}

/* ───────── disco flecks, same hues as the quiz's disco balls ───────── */
function flecks(count){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('fx'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const hues = [330, 280, 200, 160, 60, 0, 320];
  const ps = Array.from({length:count}, () => ({
    x: W/2, y: H*.32, vx: (Math.random()-.5)*14*dpr, vy: (-Math.random()*13-3)*dpr,
    r: (2+Math.random()*4)*dpr, h: hues[Math.random()*hues.length|0], life: 70+Math.random()*60 }));
  ps.forEach(p => p.max = p.life);
  (function tick(){
    ctx.clearRect(0,0,W,H);
    let alive = 0;
    for (const p of ps){ if (p.life <= 0) continue; alive++;
      p.x += p.vx; p.y += p.vy; p.vy += .32*dpr; p.vx *= .985; p.life--;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = `hsla(${p.h},100%,72%,${p.life/p.max})`; ctx.fill(); }
    if (alive) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H);
  })();
}

/* ───────── media: images + YouTube (audio clips stay covered) ───────── */
function mediaHTML(m, slot, isQuestion){
  if (!m) return '';
  if (m.kind === 'img') return `<div class="media"><img src="${esc(m.src)}" alt="" loading="lazy"></div>`;
  const covered = isQuestion && !m.video;
  return `<div class="media"><div class="yt" id="${slot}-box"><div id="${slot}-player"></div>
    ${covered?`<div class="cover"><div class="eq"><b></b><b></b><b></b><b></b></div><div class="track">Listen</div></div>`:''}</div></div>
    ${covered?`<button class="pill ghost clipbtn" id="${slot}-btn" onclick="toggleClip('${slot}')">▶︎ Play clip</button>`:''}`;
}
function mountMedia(m, slot){
  if (!m || m.kind !== 'yt') return;
  const make = () => {
    players[slot] = new YT.Player(`${slot}-player`, {
      videoId: m.id,
      playerVars: {start: m.start || 0, playsinline: 1, rel: 0, modestbranding: 1, controls: 1},
      events: {onStateChange: e => {
        const box = $(`${slot}-box`), btn = $(`${slot}-btn`);
        const playing = e.data === YT.PlayerState.PLAYING;
        if (box) box.classList.toggle('playing', playing);
        if (btn) btn.textContent = playing ? '❚❚ Pause' : '▶︎ Play clip';
      }}
    });
  };
  ytApiReady ? make() : ytQueue.push(make);
}
function toggleClip(slot){
  const p = players[slot]; if (!p || !p.getPlayerState) return;
  p.getPlayerState() === YT.PlayerState.PLAYING ? p.pauseVideo() : p.playVideo();
}
function stopAll(){ for (const k in players){ try { players[k].destroy(); } catch(e){} } players = {}; }
window.onYouTubeIframeAPIReady = () => { ytApiReady = true; ytQueue.splice(0).forEach(f => f()); };
(function(){ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

updateWelcome();
</script>
